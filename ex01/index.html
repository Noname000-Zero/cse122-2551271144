<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bốn mùa</title>
  <style>
    :root {
      --nen-khung: #FFFDE7;
      --vien-khung: #9E9E9E;
      --nen-tieu-de: #FFD9E6;
      --mau-do: #D40000;
      --mau-xanh: #0033CC;
    }

    body {
      box-sizing: border-box;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 16px;
      font-family: "Times New Roman", serif;
    }

    .khung-tho {
      box-sizing: border-box;
      width: 640px;
      min-width: 0;
      padding: 24px;
      border: 1px solid var(--vien-khung);
      background-color: var(--nen-khung);
      text-align: center;
    }

    h1 {
      margin: 0 0 20px;
      padding: 6px 0;
      background-color: var(--nen-tieu-de);
      color: var(--mau-do);
      font-size: 26px;
    }

    .kho {
      margin: 0;
      font-style: italic;
      line-height: 1.7;
    }

    .xanh {
      color: var(--mau-xanh);
    }

    .do {
      color: var(--mau-do);
    }

    hr {
      width: 55%;
      margin: 16px auto;
      border: 0;
      border-top: 1px solid var(--mau-xanh);
    }
  </style>
</head>
<body>
  <article class="khung-tho">
    <h1>BỐN MÙA</h1>
    <p class="kho xanh">
      Xuân về hoa nở khắp trời<br>
      Hạ sang nắng cháy rạng ngời phố quen<br>
      Thu về lá rụng bên thềm
    </p>
    <hr>
    <p class="kho do">
      Đông sang gió lạnh bên em đợi chờ<br>
      Bốn mùa là bốn giấc mơ<br>
      Thời gian đi mãi ta chờ đợi ai
    </p>
    <hr>
    <p class="kho xanh">
      Một năm rồi lại một năm<br>
      Vẫn còn câu hát thì thầm quê hương<br>
      Chờ xuân nắng mới soi đường
    </p>
  </article>
</body>
</html>
