<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Thư viện ảnh Việt Nam</title>
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <main>
      <h1>Thư viện ảnh Việt Nam</h1>
      <p class="subtitle">
        Bộ sưu tập 6 danh thắng tiêu biểu — minh hoạ thẻ figure / figcaption.
      </p>
      <div class="gallery">
        <figure>
          <img src="images/1-vinh-ha-long.jpg" alt="Vịnh Hạ Long" />
          <figcaption>Hình 1. Vịnh Hạ Long</figcaption>
        </figure>
        <figure>
          <img src="images/2-son-doong.jpg" alt="Hang Sơn Đoòng" />
          <figcaption>Hình 2. Hang Sơn Đoòng</figcaption>
        </figure>
        <figure>
          <img src="images/3-thac-ban-gioc.jpg" alt="Thác Bản Giốc" />
          <figcaption>Hình 3. Thác Bản Giốc</figcaption>
        </figure>
        <figure>
          <img src="images/4-fansipan.jpg" alt="Fansipan" />
          <figcaption>Hình 4. Fansipan</figcaption>
        </figure>
        <figure>
          <img src="images/5-mekong.jpg" alt="Đồng bằng sông Cửu Long" />
          <figcaption>Hình 5. Đồng bằng sông Cửu Long</figcaption>
        </figure>
        <figure>
          <img
            src="images/6-phong-nha.jpg"
            alt="Cửa Động Phong Nha bên sông Son"
          />
          <figcaption>Hình 6. Động Phong Nha</figcaption>
        </figure>
      </div>
      <footer class="credits">
        Ảnh 6:
        <a href="https://commons.wikimedia.org/wiki/File:Phong_nha_cave.jpg"
          >Tonguc Ozluk / Wikimedia Commons</a
        >,
        <a href="https://creativecommons.org/licenses/by-sa/4.0/"
          >CC BY-SA 4.0</a
        >; bản thu nhỏ, cắt hiển thị bằng CSS.
      </footer>
    </main>
  </body>
</html>
