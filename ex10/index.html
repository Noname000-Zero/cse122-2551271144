<!doctype html>
<html lang="vi">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Liên hệ với chúng tôi</title><link rel="stylesheet" href="css/style.css"></head>
<body><main><article class="form-card"><header><h1>Liên hệ với chúng tôi</h1><p>Vui lòng điền thông tin bên dưới, chúng tôi sẽ phản hồi trong 24 giờ.</p></header><form><div class="row"><div><label for="full-name">Họ và tên</label><input id="full-name" name="full-name" type="text" autocomplete="name" required></div><div><label for="email">Email</label><input id="email" name="email" type="email" autocomplete="email" required></div></div><div class="row"><div><label for="phone">Số điện thoại</label><input id="phone" name="phone" type="tel" autocomplete="tel"></div><div><label for="subject">Chủ đề</label><select id="subject" name="subject"><option>Hỏi về khoá học</option><option>Hỗ trợ kỹ thuật</option><option>Khác</option></select></div></div><label for="message">Nội dung</label><textarea id="message" name="message" rows="4" required></textarea><div class="consent"><input id="consent" name="consent" type="checkbox"><label for="consent">Tôi đồng ý nhận email phản hồi.</label></div><div class="actions"><button type="submit">Gửi liên hệ</button><button type="reset">Nhập lại</button></div><p id="form-status" role="status" aria-live="polite"></p></form></article></main><script src="js/script.js"></script></body>
</html>
